name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to Bluehost Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to Bluehost Production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_PROD_USER }}
          password: ${{ secrets.FTP_PROD_PASSWORD }}
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/_docs/**
            **/_includes/**
            **/scripts/**
            **/scratch/**
            **/node_modules/**
            .aicodeignore
